<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>风过荒野 · 穿云实验</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'%3E%3Crect width='16' height='16' fill='%23FA8A33'/%3E%3C/svg%3E">
<style>
  :root {
    --paper: #ffffff;
    --ink: #34312e;
    --ink-soft: #6b6764;
    --ink-faint: #a9a49e;
    --ink-ghost: #c4bfb8;
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }

  html, body {
    width: 100%;
    height: 100%;
    background: var(--paper);
    overflow: hidden;
    -webkit-font-smoothing: antialiased;
  }

  #scene {
    position: fixed;
    inset: 0;
    width: 100%;
    height: 100%;
    display: block;
  }

  .tabs {
    position: fixed;
    top: 3.2vh;
    left: 0;
    width: 100%;
    display: flex;
    justify-content: center;
    gap: clamp(28px, 4.2vw, 62px);
    font-family: "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
    font-size: 15px;
    letter-spacing: 0.08em;
    color: var(--ink-soft);
    z-index: 5;
  }

  .tabs button {
    appearance: none;
    background: none;
    border: none;
    padding: 0 0 7px;
    font: inherit;
    color: inherit;
    cursor: pointer;
    border-bottom: 1px solid transparent;
    transition: color 0.45s ease, border-color 0.45s ease;
  }

  .tabs button:hover { color: var(--ink); }
  .tabs button.active {
    color: var(--ink);
    border-bottom-color: var(--ink);
  }

  .caption {
    position: fixed;
    left: 0;
    bottom: 1.0vh;
    width: 100%;
    text-align: center;
    z-index: 5;
    pointer-events: none;
  }

  .title {
    font-family: "Songti SC", "STSong", "Noto Serif SC", "Songti TC", serif;
    font-size: clamp(21px, 2.0vw, 29px);
    font-weight: 400;
    letter-spacing: 0.3em;
    text-indent: 0.3em;
    color: var(--ink);
    transition: opacity 0.5s ease;
  }

  .sub {
    margin-top: 1.1vh;
    font-family: "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
    font-size: 13.5px;
    line-height: 1.95;
    letter-spacing: 0.1em;
    color: var(--ink-faint);
  }

  .note {
    margin-top: 0.85vh;
    font-family: "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
    font-size: 11.5px;
    letter-spacing: 0.14em;
    color: var(--ink-ghost);
  }
</style>
<script type="importmap">
{
  "imports": {
    "three": "./vendor/three/three.module.min.js"
  }
}
</script>
</head>
<body>
  <canvas id="scene"></canvas>

  <nav class="tabs">
    <button data-scene="river">草原河流</button>
    <button data-scene="fields">蓝金田野</button>
    <button data-scene="desert">赤土荒野</button>
    <button data-scene="sea">碧海沙洲</button>
  </nav>

  <div class="caption">
    <h1 class="title">风过荒野</h1>
    <p class="sub">云深处，风有了形状。<br>掠过赤土，也掠过片刻的迷茫。</p>
    <p class="note">赤土荒野 · 穿云实验</p>
  </div>

  <script type="module" src="./src/main.js"></script>
</body>
</html>
